services:
  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    container_name: mhc_backend
    env_file:
      - ./frontend/.env.local
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_PRIMARY_PROVIDER: ollama
      LLM_FALLBACK_PROVIDER: ollama
      LLM_RETRY_ATTEMPTS: "2"
      LLM_TIMEOUT_SECONDS: "30"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: DockerFile
    container_name: mhc_frontend
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules